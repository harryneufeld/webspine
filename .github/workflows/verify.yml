name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Webspine.slnx --configuration Release
      - run: dotnet run --no-build --configuration Release --project tests/Webspine.Checks
      - run: dotnet run --no-build --configuration Release --project tests/Webspine.ManagementChecks
      - run: dotnet run --no-build --configuration Release --project tests/Webspine.RazorChecks
