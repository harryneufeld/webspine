name: PR validation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  version:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version policy
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          php core/tests/version-bump.php --self-test
          git fetch --no-tags -- origin "$BASE_REF"
          php core/tests/version-bump.php FETCH_HEAD HEAD
