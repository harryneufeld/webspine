name: PR validation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  version:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version policy
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          php core/tests/version-bump.php --self-test
          git fetch --no-tags -- origin "$BASE_REF"
          php core/tests/version-bump.php FETCH_HEAD HEAD
  framework:
    name: Framework and Starter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run PHP 8.3 integration checks
        run: |
          docker build --build-arg PHP_BASE=php:8.3-cli-bookworm -t webspine-framework-checks -f core/tests/hosting/Dockerfile core/tests/hosting
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/source" -w /source webspine-framework-checks sh -c 'php core/tests/run.php && php site/tests/run.php'
      - name: Check release publisher without network
        run: |
          mkdir -p .dist
          cat > .dist/ci-release-php.sh <<'SH'
          #!/bin/sh
          exec docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" webspine-framework-checks php "$@"
          SH
          chmod +x .dist/ci-release-php.sh
          pwsh -NoProfile -File core/tests/publish-release.ps1 -Php "$PWD/.dist/ci-release-php.sh"
