# Replace the matching locations in CloudPanel's public-facing server block.
# Keep its generated TLS, root, logging, and settings directives.
location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
}
location ~* ^(?!/assets/).+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|avif|pdf|zip|swf|map|mjs)$ {
    expires max;
    access_log off;
}
