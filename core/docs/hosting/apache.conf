# Enable PHP (mod_php or PHP-FPM handler) and mod_rewrite first.
# HTTP example; configure HTTPS/certificates separately.
<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /srv/webspine/public
    <Directory /srv/webspine/public>
        Options -Indexes +FollowSymLinks
        AllowOverride FileInfo Indexes Options
        Require all granted
    </Directory>
</VirtualHost>
